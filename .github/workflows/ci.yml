name: TaskPulse CI Pipeline

# 1. Triggers: Run on push to main or on pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Run on a clean Ubuntu cloud virtual machine
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Validate FastAPI import & Backend syntax
      - name: Test FastAPI Backend Import
        run: |
          python -c "from backend.main import app; print('FastAPI Backend successfully loaded!')"
